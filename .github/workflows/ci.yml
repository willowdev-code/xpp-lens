name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore xpp-lens.sln

      - name: Build
        run: dotnet build xpp-lens.sln -c Release --no-restore

      - name: Test
        run: dotnet test xpp-lens.sln -c Release --no-build --logger "console;verbosity=normal"

  # The setup program is built on every push, so a broken Inno script shows up before a release.
  installer:
    name: installer
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Inno Setup
        shell: pwsh
        run: ./.github/install-inno.ps1

      - name: Package and setup program
        shell: powershell
        run: .\pack.ps1 -OutDir dist -Installer
